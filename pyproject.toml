[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiberon-battle-prototype"
version = "0.1.0"
description = "Deterministic alternate-history real-time tactics prototype"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
quiberon = "main:main"
quiberon-batch = "analysis.batch_simulation:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["simulation*", "viewer*", "scenarios*", "analysis*", "campaign*", "migration_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
scenarios = ["presets/*.json"]
